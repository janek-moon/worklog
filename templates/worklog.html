<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>worklog</title>
<style>
:root { --bg:#fff; --fg:#24292f; --muted:#57606a; --border:#d0d7de; --accent:#0969da; --code-bg:#f6f8fa; }
[data-theme="dark"] { --bg:#0d1117; --fg:#c9d1d9; --muted:#8b949e; --border:#30363d; --accent:#58a6ff; --code-bg:#161b22; }
* { box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", Helvetica, Arial, sans-serif;
       line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 2rem 1rem;
       background: var(--bg); color: var(--fg); transition: background 0.2s, color 0.2s; }
h1, h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
h1 { font-size: 2em; }
h2 { font-size: 1.5em; margin-top: 2em; }
h3 { font-size: 1.25em; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code { background: var(--code-bg); padding: 0.2em 0.4em; border-radius: 3px; font-size: 0.9em; }
pre { background: var(--code-bg); padding: 1em; border-radius: 6px; overflow-x: auto; }
pre code { background: none; padding: 0; }
ul { padding-left: 1.5em; }
li { margin: 0.2em 0; }
.theme-toggle { position: fixed; top: 1rem; right: 1rem; background: var(--bg); color: var(--fg);
                border: 1px solid var(--border); border-radius: 6px; padding: 0.4em 0.8em;
                cursor: pointer; font-size: 0.9em; }
.theme-toggle:hover { background: var(--code-bg); }
.theme-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
hr { border: none; border-top: 1px solid var(--border); margin: 2em 0; }
blockquote { border-left: 4px solid var(--border); padding-left: 1em; color: var(--muted); margin: 1em 0; }
table { border-collapse: collapse; margin: 1em 0; }
th, td { border: 1px solid var(--border); padding: 0.4em 0.8em; }
th { background: var(--code-bg); }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
<!-- CONTENT -->
<script>
(function() {
  var root = document.documentElement;
  var btn = document.getElementById('themeToggle');
  function getTheme() { try { return localStorage.getItem('worklog-theme'); } catch (e) { return null; } }
  function setTheme(v) { try { localStorage.setItem('worklog-theme', v); } catch (e) {} }
  var saved = getTheme();
  if (saved === 'dark') root.setAttribute('data-theme', 'dark');
  function update() {
    btn.textContent = root.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
  }
  update();
  btn.addEventListener('click', function() {
    if (root.getAttribute('data-theme') === 'dark') {
      root.removeAttribute('data-theme');
      setTheme('light');
    } else {
      root.setAttribute('data-theme', 'dark');
      setTheme('dark');
    }
    update();
  });
})();
</script>
</body>
</html>
